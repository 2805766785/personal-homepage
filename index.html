<style>

    content: "";
    display: block;
    width: 36px; height: 1px;
    background: #d9d9d9;
    margin: 14px auto 0;
  }

  .info-list {
    margin-top: 22px;
    text-align: left;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0 28px;
  }
  .info-block { min-width: 0; }
  .info-group {
    font-size: 12px;
    color: var(--green-deep);
    letter-spacing: 2px;
    padding: 14px 4px 6px;
    border-bottom: 1px solid #f0f0f0;
  }
  .info-group:first-child { padding-top: 0; }
  .info-item {

    padding: 11px 4px;

  .info-item .label {

  .info-item .value { color: var(--text); }

    display: flex; flex-direction: column; gap: 16px;
    min-width: 0;
    width: 100%;
    max-width: 880px;
    margin: 0 auto;

  .section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: bold;
    padding-left: 12px;
    border-left: 3px solid var(--green);
    margin-bottom: 14px;

  .chat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);

    display: flex; flex-direction: column;

    font-size: 14px;

  .msg.user .bubble { background: var(--green); color: #fff; border-top-right-radius: 4px; }

    padding: 12px 16px 4px;
    background: var(--card);
    border-top: 1px solid var(--border);

    color: var(--green-deep);

    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;

  .quick-btn:hover { background: var(--green-light); border-color: var(--green); }

  .chat-input {
    display: flex; gap: 10px;
    padding: 12px 16px 16px;
    background: var(--card);
  }
  .chat-input input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    color: var(--text);
    background: var(--card);
  }
  .chat-input input:focus { border-color: var(--green); }
  .chat-input button {
    background: var(--green-deep);
    color: #fff; border: none;
    border-radius: 999px;
    padding: 10px 24px;
    font-size: 14px;
    cursor: pointer;

  .footer {

  .typing i {

  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  @media (max-width: 900px) {
    .container { padding: 20px 14px; }
    .info-list { grid-template-columns: repeat(2, 1fr); gap: 0 20px; }

    .chat-card { height: 68vh; min-height: 420px; max-width: none; }
    .bubble { max-width: 82%; }
    .quick-questions { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .quick-questions::-webkit-scrollbar { display: none; }
    .quick-btn { white-space: nowrap; flex-shrink: 0; }
    .footer { margin-top: 24px; }
  }
</style>
</head>

    const res = await fetch(AI.url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + AI.apiKey
      },
      body: JSON.stringify({
        model: AI.model,
        stream: true,
        temperature: AI.temperature,
        max_tokens: AI.maxTokens,
        // history 里已经包含本轮的用户消息，这里只取最近几轮做上下文
        messages: [{ role: 'system', content: SYSTEM_PROMPT }].concat(history.slice(-6))
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '', full = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const data = t.slice(5).trim();
        if (data === '[DONE]') return full;
        try {
          const j = JSON.parse(data);
          const delta = (j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) || '';
          if (delta) {
            full += delta;
            bubbleEl.textContent = full;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          }
        } catch (e) {}
      }
    }
    return full;
  }

  function addMessage(text, isUser) {
    const div = document.createElement('div');
    div.className = 'msg ' + (isUser ? 'user' : 'bot');
    div.innerHTML = `
      <div class="m-avatar">${isUser ? '访' : bambooFace}</div>
      <div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function botReply(question) {
    const q = question.toLowerCase();
    for (const item of botBrain) {
      if (item.keys.some(k => q.includes(k.toLowerCase()))) return item.reply;
    }
    return fallbackReplies[Math.floor(Math.random() * fallbackReplies.length)];
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = `<div class="m-avatar">${bambooFace}</div>
      <div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  let replying = false;

  async function ask(question) {
    const text = (question || '').trim();
    if (!text || replying) return;
    replying = true;
    addMessage(text, true);
    history.push({ role: 'user', content: text });

    const typingEl = showTyping();
    let answered = '';

    if (canUseAI()) {
      try {
        const botMsg = createBotBubble();
        typingEl.remove();
        answered = await streamReply(botMsg.querySelector('.bubble'));
        bumpQuota();
        if (!answered || !answered.trim()) botMsg.remove();
      } catch (err) {
        console.warn('大模型调用失败，已回落本地知识库：', err);
      }
    }

    // 没接大模型 / 调用失败 → 用本地知识库兜底
    if (!answered || !answered.trim()) {
      if (typingEl.isConnected) {
        await new Promise(r => setTimeout(r, 500));
        typingEl.remove();
      } else {
        const t2 = showTyping();
        await new Promise(r => setTimeout(r, 500));
        t2.remove();
      }
      answered = botReply(text);
      addMessage(answered, false);
    }

    history.push({ role: 'assistant', content: answered });
    replying = false;
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    ask(text);
  }

  function askQuick(q) {
    ask(q);
  }

  // 开场白
  addMessage('你好，我是竹 🎋\n这儿是我的主页，想知道什么直接问我——爱好、近况、想去哪玩，都能聊。', false);
</script>
