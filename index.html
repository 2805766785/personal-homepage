<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陈先竹 · 个人主页</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --green: #7d9a6e;
    --green-deep: #5c7a4e;
    --green-light: #f1f6ee;
    --border: #ececec;
    --text: #3d3d3f;
    --text-light: #9a9a9e;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
  }

  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  /* ===== 横板主体：左右分栏 ===== */
  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    align-items: start;
  }

  /* ===== 左栏：个人名片 ===== */
  .profile-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    position: sticky;
    top: 40px;
  }
  .avatar {
    width: 92px; height: 92px;
    border-radius: 50%;
    margin: 0 auto 14px;
    background: #f4f6f1;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #e4e8df;
  }
  .profile-card h1 { font-size: 22px; letter-spacing: 4px; font-weight: 600; }
  .profile-card .tagline {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-light);
    letter-spacing: 1px;
  }
  .profile-card .tagline::after {
    content: "";
    display: block;
    width: 36px; height: 1px;
    background: #d9d9d9;
    margin: 14px auto 0;
  }

  .info-list { margin-top: 18px; text-align: left; }
  .info-group {
    font-size: 12px;
    color: var(--green-deep);
    letter-spacing: 2px;
    padding: 14px 4px 6px;
    border-bottom: 1px solid #f0f0f0;
  }
  .info-group:first-child { padding-top: 0; }
  .info-item {
    display: flex; gap: 12px;
    padding: 11px 4px;
    border-bottom: 1px solid #f5f5f5;
    font-size: 14px;
  }
  .info-item:last-child { border-bottom: none; }
  .info-item .label {
    color: #a0a0a4;
    flex-shrink: 0;
    width: 78px;
    font-size: 13px;
  }
  .info-item .value { color: var(--text); }

  /* ===== 右栏 ===== */
  .right-col { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

  .section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: bold;
    padding-left: 12px;
    border-left: 3px solid var(--green);
    margin-bottom: 14px;
  }
  .section-title .icon { font-size: 18px; }

  /* ===== 聊天区 ===== */
  .chat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex; flex-direction: column;
    height: 430px;
    max-width: 620px;
  }
  .chat-header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .chat-header .bot-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--green-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
  }
  .chat-header .bot-name { font-weight: bold; font-size: 15px; }
  .chat-header .bot-status { font-size: 12px; color: var(--text-light); }
  .chat-header .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #7ed99a; margin-right: 5px; vertical-align: middle;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #fcfcfc;
  }
  .msg { display: flex; margin-bottom: 14px; gap: 8px; }
  .msg .m-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .msg.bot .m-avatar { background: var(--green-light); color: var(--green-deep); font-size: 12px; font-weight: 600; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .m-avatar { background: #eef3ea; color: #8a9a82; font-size: 12px; font-weight: 600; }
  .bubble {
    max-width: 68%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.bot .bubble { background: #fff; border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.user .bubble { background: var(--green); color: #fff; border-top-right-radius: 4px; }

  .quick-questions {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 12px 16px 4px;
    background: var(--card);
    border-top: 1px solid var(--border);
  }
  .quick-btn {
    background: var(--card);
    border: 1px solid #cfe0c8;
    color: var(--green-deep);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
  }
  .quick-btn:hover { background: var(--green-light); border-color: var(--green); }

  .chat-input {
    display: flex; gap: 10px;
    padding: 12px 16px 16px;
    background: var(--card);
  }
  .chat-input input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    color: var(--text);
    background: var(--card);
  }
  .chat-input input:focus { border-color: var(--green); }
  .chat-input button {
    background: var(--green-deep);
    color: #fff; border: none;
    border-radius: 999px;
    padding: 10px 24px;
    font-size: 14px;
    cursor: pointer;
    transition: background .2s;
  }
  .chat-input button:hover { background: var(--green); }

  .footer {
    text-align: center; margin-top: 36px;
    font-size: 13px; color: var(--text-light);
  }

  /* ===== 平板适配 ===== */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 260px 1fr; gap: 16px; }
    .container { padding: 20px 14px; }
  }

  /* ===== 手机适配：切回纵向 ===== */
  @media (max-width: 640px) {
    .layout { grid-template-columns: 1fr; }
    .profile-card { position: static; }
    .chat-card { height: 500px; max-width: none; }
    .bubble { max-width: 80%; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="layout">

    <!-- ===== 左栏：个人名片 ===== -->
    <aside class="profile-card">
      <div class="avatar">
        <svg viewBox="0 0 64 64" width="50" height="50" fill="none" stroke="#7d9070" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <!-- 主竹竿 -->
          <path d="M27 12 V52"/>
          <path d="M23 12 H31"/><path d="M23 23 H31"/><path d="M23 34 H31"/><path d="M23 45 H31"/>
          <!-- 副竹竿 -->
          <path d="M41 22 V52"/>
          <path d="M37.5 22 H44.5"/><path d="M37.5 32 H44.5"/><path d="M37.5 42 H44.5"/>
          <!-- 叶子 -->
          <path d="M27 23 C21 19 15 18.5 10 15"/>
          <path d="M27 23 C21 25 16 25.5 11 27"/>
          <path d="M41 32 C36 28 31 27.5 26.5 24.5"/>
          <path d="M41 32 C36 34 31.5 34.5 27 36"/>
        </svg>
      </div>
      <h1>陈先竹</h1>
      <p class="tagline">不断寻找 幸福的共振</p>

      <div class="info-list">
        <div class="info-group">基本信息</div>
        <div class="info-item">
          <span class="label">身份</span>
          <span class="value">上海师范大学 · 大三学生</span>
        </div>
        <div class="info-item">
          <span class="label">坐标</span>
          <span class="value">上海</span>
        </div>
        <div class="info-item">
          <span class="label">特点</span>
          <span class="value">注重细节，理性务实</span>
        </div>

        <div class="info-group">兴趣与热爱</div>
        <div class="info-item">
          <span class="label">兴趣</span>
          <span class="value">音乐 · 追剧 · 旅游</span>
        </div>
        <div class="info-item">
          <span class="label">旅行偏好</span>
          <span class="value">能慢下来、有生活气息的地方</span>
        </div>

        <div class="info-group">近况与期待</div>
        <div class="info-item">
          <span class="label">近况</span>
          <span class="value">认真备考中</span>
        </div>
        <div class="info-item">
          <span class="label">关心方向</span>
          <span class="value">大学以后的生活会是怎样</span>
        </div>
        <div class="info-item">
          <span class="label">小期待</span>
          <span class="value">经济独立、有自己的小空间</span>
        </div>
      </div>
    </aside>

    <!-- ===== 右栏：数字分身聊天区 ===== -->
    <main class="right-col">
      <section>
        <div class="section-title">数字分身</div>
        <div class="chat-card">
          <div class="chat-header">
            <div class="bot-avatar">🎋</div>
            <div>
              <div class="bot-name">竹</div>
              <div class="bot-status"><span class="dot"></span>在线 · 随时想聊</div>
            </div>
          </div>

          <div class="chat-messages" id="chatMessages"></div>

          <div class="quick-questions">
            <button class="quick-btn" onclick="askQuick('你最喜欢做什么？')">你最喜欢做什么？</button>
            <button class="quick-btn" onclick="askQuick('你最想去哪里旅游？')">你最想去哪里旅游？</button>
            <button class="quick-btn" onclick="askQuick('你现在想获得什么？')">你现在想获得什么？</button>
          </div>

          <div class="chat-input">
            <input type="text" id="chatInput" placeholder="输入你想问的问题…" onkeydown="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">发送</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="footer">© 2026 陈先竹 · 不断寻找幸福的共振</footer>
</div>

<script>
  const messagesEl = document.getElementById('chatMessages');
  const inputEl = document.getElementById('chatInput');

  // 数字分身的知识库（可继续补充）
  const botBrain = [
    { keys: ['喜欢做什么', '爱好', '兴趣', '平时做', '喜欢'],
      reply: '最喜欢听音乐和追剧，特别喜欢看演唱会——现场的氛围是戴耳机永远给不了的。追剧则是忙碌学习后最好的放松方式。有机会的话也很喜欢出去旅游，看看不一样的风景。' },
    { keys: ['演唱会', '音乐会', '现场', 'live'],
      reply: '我很喜欢看演唱会。现场那种大家一起合唱、灯光亮起的瞬间，是戴耳机永远听不到的感动。对我来说，那就是"幸福的共振"最具体的时刻。' },
    { keys: ['旅游', '去哪里', '想去哪', '旅行'],
      reply: '最想去的旅游地，我的答案一直在更新。我喜欢那种能让人慢下来、有生活气息的地方，比如有海的城市、有老街的小镇。你有推荐的旅行地吗？' },
    { keys: ['想获得', '想要', '希望', '目标', '想得到'],
      reply: '现在最想获得的，大概是一份"确定感"——学业顺利通过考试，也期待体验大学毕业以后独立、自由的生活。简单说就是：一步步把日子过成自己喜欢的样子。' },
    { keys: ['毕业', '以后', '未来', '大学以后', '生活'],
      reply: '我一直很好奇大学毕业后的生活是什么样的。想象过很多次：经济独立、有自己的小空间、假期可以随时出发去旅行。虽然有点未知，但我挺期待的。' },
    { keys: ['备考', '考试', '学习', '在忙什么', '最近'],
      reply: '最近在认真备考中。我属于"理性务实型"——会制定计划、注重细节，一步步推进。虽然偶尔会累，但我相信踏实走好每一步就会有好的结果。' },
    { keys: ['你是谁', '你叫什么', '介绍一下'],
      reply: '你好，我是竹。可以问我任何事情——我的爱好、近况，或者随便聊聊。' },
    { keys: ['名字', '陈先竹', '她是谁'],
      reply: '我叫陈先竹，就读于上海师范大学，现在是大三学生。我喜欢的一句话是："不断寻找幸福的共振"。' },
    { keys: ['特点', '性格', '什么样的人'],
      reply: '我是一个注重细节、理性务实的人。熟悉之后你会发现我其实也很有温度，喜欢音乐、追剧和旅游，是个认真生活的人。' },
    { keys: ['你好', 'hi', 'hello', '嗨', '在吗'],
      reply: '你好，很高兴见到你。想聊点什么？可以问我的爱好、近况，或者随便聊聊。' },
    { keys: ['谢谢', '感谢'],
      reply: '不客气，欢迎常来。' },
  ];

  const fallbackReplies = [
    '这个问题我一时答不上来。在我的世界里，音乐、追剧和旅游占了很大一部分，相关的话题随时可以聊。',
    '嗯，这个我还真没想过。不过我是个注重细节、理性务实的人，或许可以从这个角度想想？',
    '这个问题超出了我的范围。你可以问我"最喜欢做什么""最想去哪里旅游""最近在忙什么"这类问题。',
  ];

  const bambooFace = '🎋';

  function addMessage(text, isUser) {
    const div = document.createElement('div');
    div.className = 'msg ' + (isUser ? 'user' : 'bot');
    div.innerHTML = `
      <div class="m-avatar">${isUser ? '访' : bambooFace}</div>
      <div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function botReply(question) {
    const q = question.toLowerCase();
    for (const item of botBrain) {
      if (item.keys.some(k => q.includes(k.toLowerCase()))) return item.reply;
    }
    return fallbackReplies[Math.floor(Math.random() * fallbackReplies.length)];
  }

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    addMessage(text, true);
    setTimeout(() => addMessage(botReply(text), false), 500);
  }

  function askQuick(q) {
    addMessage(q, true);
    setTimeout(() => addMessage(botReply(q), false), 500);
  }

  // 开场白
  addMessage('你好，有什么想问我的吗？\n爱好、近况、想去哪里玩，都可以聊。', false);
</script>
</body>
</html>
